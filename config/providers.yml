providers:
  plaid:
    # Pricing last verified: 2026-05-07
    # Transactions product: $0.30/connected account/month
    # Amortized assuming ~5 syncs/month (get_accounts + sync_transactions per sync = 10 calls/month)
    link_session:
      base_cost_cents: 0      # Plaid does not charge for Link token generation
      markup_percent: 0
    exchange_token:
      base_cost_cents: 0      # Plaid does not charge for public token exchange
      markup_percent: 0
    get_accounts:
      base_cost_cents: 3      # $0.30/month ÷ 10 calls
      markup_percent: 1
    sync_transactions:
      base_cost_cents: 3      # $0.30/month ÷ 10 calls
      markup_percent: 1
    verify_income:
      base_cost_cents: 150
      markup_percent: 2
    verify_identity:
      base_cost_cents: 100
      markup_percent: 2
    initiate_transfer:
      base_cost_cents: 25
      markup_percent: 1
    balance_check:
      base_cost_cents: 10
      markup_percent: 1

  openai:
    chat_completion:
      base_cost_cents: 0
      markup_percent: 10

  stripe:
    charge:
      base_cost_cents: 0
      markup_percent: 0.5

  sendgrid:
    send_email:
      base_cost_cents: 1
      markup_percent: 0
